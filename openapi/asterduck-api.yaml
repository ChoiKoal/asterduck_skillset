openapi: 3.1.0
info:
  title: Aster.duck API
  description: |
    Aster.duck 플랫폼 API — CoffeeDuck & WineDuck 테이스팅 노트 서비스.

    커피와 와인을 검색하고, 테이스팅 노트를 기록·관리할 수 있습니다.

    ## 인증
    - `/api/auth/login`으로 JWT 토큰 발급 (24시간 유효)
    - 인증이 필요한 API는 `Authorization: Bearer {token}` 헤더 사용
    - 검색/조회 API는 대부분 인증 불필요

    ## 다국어
    - `Accept-Language` 헤더로 응답 언어 변경: `ko`, `ja`, `en`
  version: 0.7.1
  contact:
    name: Aster.duck
    url: https://asterduck.koalstudio.com
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://coffeeduckbe-production.up.railway.app/api
    description: Production

tags:
  - name: Auth
    description: 공용 인증 (로그인, 회원가입, 토큰)
  - name: CoffeeDuck - Search
    description: 커피 검색 & 탐색
  - name: CoffeeDuck - Tasting
    description: 커피 테이스팅 노트 CRUD
  - name: CoffeeDuck - Coffee
    description: 커피 등록
  - name: WineDuck - Search
    description: 와인 검색 & 지역 탐색
  - name: WineDuck - Tasting
    description: 와인 테이스팅 노트 CRUD
  - name: WineDuck - Wine
    description: 와인 등록
  - name: WineDuck - Cellar
    description: 와인 셀러(보유 와인) 관리
  - name: WineDuck - Discovery
    description: 커뮤니티 팔레트 집계 / 사용자 취향 기반 추천
  - name: WineDuck - Conquest
    description: 정복 도감(정복률)·빈티지 축·뱃지 (본인 데이터, 인증 필요)

# ──────────────────────────────────────────
# Auth
# ──────────────────────────────────────────
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인 (JWT 토큰 발급)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "myuser"
                password:
                  type: string
                  example: "mypassword"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: JWT Bearer Token (24시간 유효)
                  user:
                    $ref: "#/components/schemas/UserInfo"

  /auth/register:
    post:
      tags: [Auth]
      summary: 회원가입
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, name]
              properties:
                username:
                  type: string
                password:
                  type: string
                name:
                  type: string
                  description: 표시 이름
      responses:
        "200":
          description: 가입 성공

  /auth/verify:
    get:
      tags: [Auth]
      summary: 토큰 검증
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 토큰 유효
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/UserInfo"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: 비밀번호 변경
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: 변경 성공

  # ──────────────────────────────────────────
  # CoffeeDuck - Search
  # ──────────────────────────────────────────
  /coffee:
    get:
      tags: [CoffeeDuck - Search]
      summary: 커피 목록 (검색 + 페이지네이션)
      operationId: listCoffees
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: 검색 키워드
        - name: search_type
          in: query
          schema:
            type: string
            enum: [all, name, supplier, country, varietal, flavor_notes, flavor_note_ids]
            default: all
        - name: flavor_note_ids
          in: query
          schema:
            type: string
          description: 플레이버 노트 ID (쉼표 구분, search_type=flavor_note_ids와 함께 사용)
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, name, avg_rating]
            default: created_at
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  coffees:
                    type: array
                    items:
                      $ref: "#/components/schemas/CoffeeListItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

    post:
      tags: [CoffeeDuck - Coffee]
      summary: 커피 등록
      operationId: createCoffee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoffeeCreateRequest"
      responses:
        "200":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  coffee_id:
                    type: integer

  /coffee/{coffee_id}:
    get:
      tags: [CoffeeDuck - Search]
      summary: 커피 상세 조회
      operationId: getCoffee
      parameters:
        - name: coffee_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 커피 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  coffee:
                    $ref: "#/components/schemas/CoffeeDetail"

  /coffee/search-by-name:
    get:
      tags: [CoffeeDuck - Search]
      summary: 커피 이름 검색 (정확 매칭 + 유사 결과)
      description: 중복 확인에 활용. 정확 매칭이 있으면 coffee에 반환, 없으면 null. 유사 결과는 similar에 최대 5개.
      operationId: searchCoffeeByName
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  coffee:
                    nullable: true
                    description: 정확 매칭 결과 (없으면 null)
                  similar:
                    type: array
                    items:
                      type: object
                  search_name:
                    type: string

  /flavor-notes:
    get:
      tags: [CoffeeDuck - Search]
      summary: 플레이버 노트 전체 목록
      description: |
        계층 구조: Level 1 (대분류) → Level 2 (중분류) → Level 3 (세부 향).
        테이스팅 노트에서는 세부 향의 ID를 사용.
      operationId: listFlavorNotes
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
            enum: [ko, ja, en]
      responses:
        "200":
          description: 플레이버 노트 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  flavor_notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlavorNote"

  /coffeeduck/flavor-notes/popular:
    get:
      tags: [CoffeeDuck - Search]
      summary: 인기 플레이버 노트 (Top 12)
      operationId: popularFlavorNotes
      responses:
        "200":
          description: 인기 플레이버 노트

  /coffee/{coffee_id}/user-flavor-notes:
    get:
      tags: [CoffeeDuck - Search]
      summary: 커피별 사용자 향미 통계
      operationId: coffeeUserFlavorNotes
      parameters:
        - name: coffee_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 향미 통계

  /varieties:
    get:
      tags: [CoffeeDuck - Search]
      summary: 커피 품종 전체 목록
      operationId: listVarieties
      responses:
        "200":
          description: 품종 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  varieties:
                    type: array
                    items:
                      type: string

  # ──────────────────────────────────────────
  # CoffeeDuck - Tasting
  # ──────────────────────────────────────────
  /coffeeduck/tasting/coffees/{coffee_id}/notes:
    post:
      tags: [CoffeeDuck - Tasting]
      summary: 커피 테이스팅 노트 등록
      operationId: createCoffeeTasting
      security:
        - bearerAuth: []
      parameters:
        - name: coffee_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoffeeTastingCreateRequest"
      responses:
        "200":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  tasting_note_id:
                    type: integer

    get:
      tags: [CoffeeDuck - Tasting]
      summary: 특정 커피의 테이스팅 목록
      operationId: listCoffeeTastings
      security:
        - bearerAuth: []
      parameters:
        - name: coffee_id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 테이스팅 목록

  /coffeeduck/tasting/notes/{note_id}:
    get:
      tags: [CoffeeDuck - Tasting]
      summary: 테이스팅 노트 상세 조회
      operationId: getCoffeeTasting
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 테이스팅 상세

    put:
      tags: [CoffeeDuck - Tasting]
      summary: 테이스팅 노트 수정 (본인만)
      operationId: updateCoffeeTasting
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoffeeTastingUpdateRequest"
      responses:
        "200":
          description: 수정 성공

    delete:
      tags: [CoffeeDuck - Tasting]
      summary: 테이스팅 노트 삭제 (본인만)
      operationId: deleteCoffeeTasting
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제 성공

  /coffeeduck/tasting/coffees/{coffee_id}/stats:
    get:
      tags: [CoffeeDuck - Tasting]
      summary: 커피 커뮤니티 통계 (공개)
      description: 인증 불필요. 해당 커피의 평균 팔레트, 평균 평점, 총 테이스팅 수.
      operationId: coffeeTastingStats
      parameters:
        - name: coffee_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      total_tastings:
                        type: integer
                      avg_rating:
                        type: number
                      avg_palate:
                        type: object
                        properties:
                          avg_acidity:
                            type: number
                          avg_body:
                            type: number
                          avg_sweetness:
                            type: number
                          avg_bitterness:
                            type: number
                          avg_finish:
                            type: number

  /coffeeduck/tasting/users/{user_id}/stats:
    get:
      tags: [CoffeeDuck - Tasting]
      summary: 내 테이스팅 통계 (본인만)
      operationId: myTastingStats
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 사용자 통계

  # ──────────────────────────────────────────
  # WineDuck - Search
  # ──────────────────────────────────────────
  /wineduck/wines/search:
    get:
      tags: [WineDuck - Search]
      summary: 와인 이름 검색
      operationId: searchWines
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: 검색어 (부분 매칭)
        - name: vintage
          in: query
          schema:
            type: integer
          description: 빈티지 연도 필터
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  wines:
                    type: array
                    items:
                      $ref: "#/components/schemas/WineSearchResult"

  /wineduck/wines/autocomplete:
    get:
      tags: [WineDuck - Search]
      summary: 와인 자동완성 검색
      description: 2글자 이상 입력 시 prefix → contains 2단계 매칭
      operationId: autocompleteWines
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: 자동완성 결과

  /wineduck/countries:
    get:
      tags: [WineDuck - Search]
      summary: 와인 생산국 목록
      operationId: listWineCountries
      responses:
        "200":
          description: 국가 목록

  /wineduck/countries/{country_id}/regions:
    get:
      tags: [WineDuck - Search]
      summary: 특정 국가의 와인 지역 목록
      operationId: listWineRegions
      parameters:
        - name: country_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 지역 목록 (하위 지역 포함)

  /wineduck/regions/{region_id}/appellations:
    get:
      tags: [WineDuck - Search]
      summary: 특정 지역의 아펠라시옹 목록
      operationId: listAppellations
      parameters:
        - name: region_id
          in: path
          required: true
          schema:
            type: integer
        - name: include_sub
          in: query
          schema:
            type: boolean
            default: false
          description: 하위 지역의 아펠라시옹도 포함
      responses:
        "200":
          description: 아펠라시옹 목록

  /wineduck/appellations/search:
    get:
      tags: [WineDuck - Search]
      summary: 아펠라시옹 이름 검색 (와인 등록 정본 resolve)
      description: |
        와인 등록 시 `appellation_id`를 확정하기 위한 **정본 레지스트리 resolve 단계**다.
        질의어(`q`)를 아펠라시옹 마스터에서 검색해 상위 10건을 반환한다. 인증 불필요(공개).
        정렬은 결정적(deterministic)이며 prefix 매칭이 먼저 온다.
        와인 등록 워크플로: 여기서 후보를 찾고 라벨의 name/region/country와 대조해 `id`를
        확정한 뒤 `POST /wineduck/wines`의 `appellation_id`로 넘긴다. 확신이 없으면 넘기지 않는다.
      operationId: searchAppellations
      parameters:
        - name: q
          in: query
          required: true
          description: 검색어. 공백/빈 문자열 또는 허용 길이 초과 시 400.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: 매칭된 아펠라시옹 상위 10건(prefix 우선, 결정적 순서)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppellationSearchResponse"
        "400":
          description: q가 비었거나(빈/공백) 허용 길이를 초과함

  /wineduck/wines/{wine_id}:
    get:
      tags: [WineDuck - Search]
      summary: 와인 상세 조회
      operationId: getWine
      parameters:
        - name: wine_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 와인 상세

  /wineduck/wines:
    get:
      tags: [WineDuck - Search]
      summary: 와인 목록 (필터링)
      operationId: listWines
      description: |
        일반 카탈로그 목록. 지리 ID 필터는 지원하지 않는다.
        국가/지역/아펠라시옹 탐색은 `/wineduck/wines/by-region`을 사용한다.
      parameters:
        - name: user_id
          in: query
          description: 해당 사용자가 등록한 와인만 조회
          schema:
            type: integer
        - name: search
          in: query
          description: 와인명, 생산자, 품종 부분 검색
          schema:
            type: string
        - name: wine_type
          in: query
          description: 콤마 구분 다중값 지원. 정식 값과 레거시 white_sparkling 호환.
          schema:
            type: string
            example: red,rose
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 와인 목록

    post:
      tags: [WineDuck - Wine]
      summary: 와인 등록
      operationId: createWine
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WineCreateRequest"
      responses:
        "201":
          description: 등록 성공. 요청에서 이름/ID로 해결된 지리 값도 반환한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineCreateResponse"
        "400":
          description: canonical_name 누락, wine_type/음용적기/마스터 지리 값이 유효하지 않음
        "401":
          description: 인증 필요
        "500":
          description: 서버 오류

  /wineduck/wines/by-region:
    get:
      tags: [WineDuck - Search]
      summary: 국가·지역·아펠라시옹별 와인 탐색
      description: |
        지리 ID 기반 전용 탐색. appellation_id > region_id > country_id 우선순위로
        가장 높은 한 필터만 적용한다. region_id는 선택 지역과 바로 아래 하위 지역을 포함한다.
      operationId: listWinesByRegion
      parameters:
        - { name: country_id, in: query, schema: { type: integer } }
        - { name: region_id, in: query, schema: { type: integer } }
        - { name: appellation_id, in: query, schema: { type: integer } }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 지리 범위 와인 목록과 페이지네이션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineByRegionResponse"
        "400":
          description: 유효하지 않은 페이지네이션. wine_type 및 텍스트 결합 필터는 이 경로에서 지원하지 않음.
        "500":
          description: 서버 오류

  # ──────────────────────────────────────────
  # WineDuck - Tasting
  # ──────────────────────────────────────────
  /wineduck/wines/{wine_id}/tastings:
    post:
      tags: [WineDuck - Tasting]
      summary: 와인 테이스팅 노트 등록
      operationId: createWineTasting
      security:
        - bearerAuth: []
      parameters:
        - name: wine_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WineTastingCreateRequest"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WineTastingCreateResponse"
        "400":
          description: wine_type 누락·유효하지 않은 입력
        "401":
          description: 인증 필요
        "404":
          description: 와인을 찾을 수 없음
        "500":
          description: 서버 오류

    get:
      tags: [WineDuck - Tasting]
      summary: 특정 와인의 테이스팅 목록
      operationId: listWineTastings
      parameters:
        - name: wine_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 테이스팅 목록

  /wineduck/tastings/{tasting_id}:
    get:
      tags: [WineDuck - Tasting]
      summary: 테이스팅 노트 상세 조회
      operationId: getWineTasting
      parameters:
        - name: tasting_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 테이스팅 상세

    put:
      tags: [WineDuck - Tasting]
      summary: 테이스팅 노트 수정 (본인만)
      operationId: updateWineTasting
      security:
        - bearerAuth: []
      parameters:
        - name: tasting_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WineTastingUpdateRequest"
      responses:
        "200":
          description: 수정 성공

    delete:
      tags: [WineDuck - Tasting]
      summary: 테이스팅 노트 삭제 (본인만)
      operationId: deleteWineTasting
      security:
        - bearerAuth: []
      parameters:
        - name: tasting_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제 성공

  /wineduck/users/{user_id}/tastings:
    get:
      tags: [WineDuck - Tasting]
      summary: 내 와인 테이스팅 목록 (본인만)
      operationId: myWineTastings
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: wine_type
          in: query
          description: 필터에는 정식 타입만 허용. white/sparkling은 저장된 legacy white_sparkling도 포함한다.
          schema: { type: string, enum: [red, white, sparkling, rose] }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, rating_high], default: newest }
      responses:
        "200":
          description: 본인 테이스팅 목록과 offset 페이지네이션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWineTastingsResponse"
        "400": { description: "잘못된 limit, offset, wine_type 또는 sort" }
        "401": { description: 인증 필요 }
        "403": { description: 본인의 목록만 조회 가능 }
        "500": { description: 서버 오류 }

  /wineduck/quick-tasting:
    post:
      tags: [WineDuck - Tasting]
      summary: 마신 와인 빠른 등록 (검색·등록·시음 원스텝)
      description: |
        와인 특정과 시음 기록을 한 번에 처리한다.
        - `wine_id` 없이 보내면 정규화된 `(wine_name, wine_type, vintage_year)` 3필드로 기존 와인을 매칭한다.
          같은 이름이라도 빈티지·타입이 다르면 **별도 와인 row**가 생성된다 (정복 도감 빈티지 축의 집계 단위).
        - NV(논빈티지)는 `vintage_year` 생략/`null` — NV는 NV끼리만 매칭된다. 빈 문자열은 NV로 정규화.
        - `vintage_year`가 1900~(현재+1) 범위 밖 정수면 400.
        - `wine_id` 지정 시 name/type/vintage는 **카탈로그가 정본** — 생략한 필드는 정본으로 채워지고, **명시적으로 동봉한 필드만** 정본과 비교해 다르면 409. (`vintage_year: null` 명시는 NV 주장으로 취급 — 생략과 다름)
        - 신규 와인 생성 시 와인명에서 아펠라시옹 자동매칭을 시도하며,
          `appellation_id`/`region_id`/`country_id`를 명시하면 그 값을 우선 사용한다(부분 전달 시 상위 자동 보강).
      operationId: quickTasting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                식별 방법 2택 — `wine_id` 단독 (카탈로그 정본 사용, 권장), 또는 `wine_name`+`wine_type`(+`vintage_year`) 조합.
                wine_id 미지정 시 wine_name/wine_type 필수. rating은 선택(0.0~5.0).
              properties:
                wine_id:      { type: integer, nullable: true, description: 지정 시 카탈로그 정본 사용 — 단독 전송 가능·권장 (name/type/vintage 동봉 비권장) }
                wine_name:    { type: string }
                wine_type:    { type: string, enum: [red, white, sparkling, rose, white_sparkling] }
                vintage_year: { type: integer, nullable: true, description: NV는 null/생략. 1900~현재+1 }
                rating:       { type: number }
                one_liner:    { type: string }
                tasted_at:    { type: string, format: date }
                appellation_id: { type: integer, nullable: true }
                region_id:      { type: integer, nullable: true }
                country_id:     { type: integer, nullable: true }
      responses:
        "201":
          description: 시음 저장 (필요 시 와인 신규 생성 포함)
        "400":
          description: 유효하지 않은 입력 (범위 밖 vintage_year, 잘못된 geo ID 등)
        "409":
          description: wine_id 카탈로그 정본과 동봉 필드 불일치
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  code:    { type: string, example: WINE_ID_FIELD_MISMATCH }
                  conflict_fields:
                    type: array
                    items: { type: string }
                    example: [vintage_year]
                  canonical_values:
                    type: object
                    description: 카탈로그 정본 3필드 전체 (wine_name/wine_type/vintage_year)
                    additionalProperties: true

  # ── WineDuck Conquest & Vintage (본인 데이터, 인증 필요) ──
  /wineduck/me/conquest:
    get:
      tags: [WineDuck - Conquest]
      operationId: getConquest
      summary: 전체 정복 요약 (총계 + 지역별 정복률)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 정복 요약. totals(tasted/countries/regions/appellations/vintages) + regions[]{region_id,name,country,appellations_total,appellations_conquered,rate}
  /wineduck/me/conquest/region/{region_id}:
    get:
      tags: [WineDuck - Conquest]
      operationId: getConquestRegion
      summary: 지역 도감 (아펠라시옹 리스트 + 정복 여부, ?vintage 필터)
      security:
        - bearerAuth: []
      parameters:
        - name: region_id
          in: path
          required: true
          schema: { type: integer }
        - name: vintage
          in: query
          required: false
          description: 특정 빈티지(연도) 또는 'NV'(빈티지 미상) 기준으로 정복 필터
          schema: { type: string }
      responses:
        '200':
          description: region{id,name,country} + my_vintages[] + appellations[]{appellation_id,name,classification,conquered,vintages_count}
  /wineduck/me/conquest/board:
    get:
      tags: [WineDuck - Conquest]
      operationId: getConquestBoard
      summary: 전체 정복 카탈로그 보드
      description: "전체 화면/전체 카탈로그용 정식 경로. 사용자별 응답이며 Cache-Control: no-store."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vintage
          in: query
          description: 연도 또는 NV. 생략하면 전체 빈티지.
          schema: { type: string }
      responses:
        '200':
          description: 국가→지역→아펠라시옹 계층의 전체 보드
          headers:
            Cache-Control: { schema: { type: string }, example: "no-store, must-revalidate" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConquestBoardResponse' }
        '400': { description: vintage는 정수 또는 NV여야 함 }
        '401': { description: 인증 필요 }
        '503':
          description: 계층 스키마 준비 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConquestBoardSchemaNotReadyResponse' }
        '500': { description: 서버 오류 }
  /wineduck/me/conquest/map:
    get:
      tags: [WineDuck - Conquest]
      operationId: getConquestMapDeprecated
      summary: Deprecated coordinate conquest map
      deprecated: true
      description: 호환성 전용 좌표 기반 map. 신규 전체 카탈로그는 `/me/conquest/board`를 사용한다.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 레거시 map 응답 }
        '401': { description: 인증 필요 }
        '503': { description: 좌표 스키마 준비 중 }

  /wineduck/me/conquest/appellation/{appellation_id}:
    get:
      tags: [WineDuck - Conquest]
      operationId: getConquestAppellation
      summary: 아펠라시옹 빈티지 타임라인 (내가 마신 와인들)
      security:
        - bearerAuth: []
      parameters:
        - name: appellation_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: appellation{id,name,region} + vintages[]{vintage,wine_id,tasting_id,rating,wine_name,tasted_at} (vintage null=NV)
  /wineduck/me/badges:
    get:
      tags: [WineDuck - Conquest]
      operationId: getBadges
      summary: 뱃지 (획득/미획득 + 진행도)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: badges[]{code,label,earned,progress?{cur,target}}
  /wineduck/me/vintages:
    get:
      tags: [WineDuck - Conquest]
      operationId: getVintages
      summary: 내가 마신 빈티지 연도별 집계
      security:
        - bearerAuth: []
      responses:
        '200':
          description: vintages[]{vintage,count} (연도 내림차순, vintage null=NV 마지막)
  /wineduck/me/vintages/{year}:
    get:
      tags: [WineDuck - Conquest]
      operationId: getVintageWines
      summary: 특정 빈티지로 마신 와인 전체 (지역 무관)
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          description: 연도(정수) 또는 'NV'
          schema: { type: string }
      responses:
        '200':
          description: vintage + wines[]{tasting_id,wine_id,wine_name,wine_type,rating,region,appellation,country,tasted_at}

# ──────────────────────────────────────────
# WineDuck - Discovery (community aggregates / personalized recommendations)
# ──────────────────────────────────────────
  /wineduck/wines/aggregates/palate-avg:
    get:
      tags: [WineDuck - Discovery]
      summary: 커뮤니티 평균 팔레트 집계
      description: |
        전체(또는 wine_type별) 테이스팅 노트의 5축 팔레트(sweetness/acidity/body/tannin/finish) 평균.
        FE 레이더 차트 오버레이 / 비교 기준선 용도. 인증 불필요.
      operationId: getCommunityPalateAvg
      parameters:
        - name: wine_type
          in: query
          description: 타입 필터 (없으면 전체 평균). 미지원 값은 400.
          schema:
            type: string
            enum: [red, white, sparkling, rose, white_sparkling]
      responses:
        "200":
          description: 평균 팔레트 + 표본 수
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  avg_palate:
                    type: object
                    description: 5축 평균 (각 축 0~5, 표본 없으면 null)
                    properties:
                      sweetness: { type: number, nullable: true }
                      acidity:   { type: number, nullable: true }
                      body:      { type: number, nullable: true }
                      tannin:    { type: number, nullable: true }
                      finish:    { type: number, nullable: true }
                  sample_count: { type: integer, description: 집계에 포함된 테이스팅 노트 수 }
                  wine_type:    { type: string, description: 적용된 필터 (`all` if none) }
        "400":
          description: 미지원 wine_type (DB 접근 전 거부)

  /wineduck/me/palate/insight:
    get:
      tags: [WineDuck - Discovery]
      summary: 내 팔레트 활성화 인사이트
      description: |
        시음 수에 따라 S0(0), S1(1~2), S2(3~5), S3(6+) 상태와
        아펠라시옹 취향 후보 및 다음 CTA를 반환한다. 본인 토큰 기준이며 캐시하지 않는다.
      operationId: getMyPalateInsight
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "state, candidates, next_cta 및 상태별 clue/taste_tendency. Cache-Control: no-store, must-revalidate."
          headers:
            Cache-Control: { schema: { type: string }, example: "no-store, must-revalidate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PalateInsightResponse" }
        "401": { description: 인증 필요 }
        "500": { description: 서버 오류 }

  /wineduck/users/{user_id}/recommendations:
    get:
      tags: [WineDuck - Discovery]
      summary: 사용자 취향 기반 와인 추천 TOP N
      description: |
        팔레트 유사도·커뮤니티 표본/평점·음용 적기와 선호 타입/국가/품종으로 점수화한다.
        본인만 조회 가능 (path `user_id` 와 토큰 user_id 일치 검증).
        테이스팅 노트 총 3개 미만이면 `need_more: true` + `wines: []` 반환.
        이미 시음한 와인을 일괄 제외하지 않으며, 사용자 최고 평점이 2점 이하인 와인만 제외한다.
      operationId: getUserRecommendations
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          description: 반환 개수 (기본 8, 최대 20)
          schema:
            type: integer
            default: 8
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: "추천 결과 (게이팅 미달 시 빈 배열 + need_more=true). Cache-Control: no-store."
          headers:
            Cache-Control: { schema: { type: string }, example: "no-store, must-revalidate" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineRecommendationsResponse" }
        "401": { description: 인증 필요 }
        "403": { description: 본인이 아닌 다른 user_id 조회 시도 }
        "500": { description: 서버 오류 }

# ──────────────────────────────────────────
# WineDuck - Cellar
# ──────────────────────────────────────────
  /wineduck/analyze-label:
    post:
      tags: [WineDuck - Wine]
      operationId: analyzeWineLabel
      summary: 와인 라벨 이미지 분석
      description: |
        공개 보조 분석 경로. 1~5개의 base64 또는 data URL 이미지를 받는다.
        `wine_info`는 모델 생성 출력이며 서버가 wine type·지리·이름을 검증하지 않는다. 현재 출력은 legacy `white_sparkling`을 낼 수 있으므로, 쓰기 전 사용자 확인·중복 검색·마스터 지리 매핑이 필요하다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WineLabelAnalysisRequest' }
      responses:
        '200':
          description: 분석 후보와 사용량
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WineLabelAnalysisResponse' }
        '400': { description: 이미지가 없거나 5장을 초과함 }
        '500': { description: 분석 제공자/결과 파싱 오류 }

  /cellar:
    get:
      tags: [WineDuck - Cellar]
      summary: 셀러 목록 조회 (페이지네이션 + 필터)
      operationId: listCellarEntries
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: |
            기본 `in_cellar`. 단일 값 또는 쉼표로 다중 값 지정 가능.
            허용 값: `in_cellar` / `consumed` / `gifted` / `received`.
            예: `in_cellar,received` (보유 + 선물받음).
          schema:
            type: string
            default: in_cellar
            example: in_cellar,received
        - name: wine_type
          in: query
          description: 정식 타입 또는 레거시 white_sparkling. 쉼표 다중값 지원.
          schema:
            type: string
            example: red,white
        - name: sort
          in: query
          description: |
            정렬 옵션.
            - `newest` / `oldest`: 등록일 기준
            - `purchase_date`: 구매일 DESC
            - `drink_soon`: `drink_until_year` ASC (와인 음용적기 임박순)
            - `consumed_recent`: `consumed_at` DESC (`status=consumed` 조합 권장)
          schema:
            type: string
            enum: [newest, oldest, purchase_date, drink_soon, consumed_recent]
            default: newest
        - name: q
          in: query
          description: canonical_name 또는 producer 부분 매칭
          schema:
            type: string
        - name: appellation_id
          in: query
          description: 선택한 활성 아펠라시옹과 모든 활성 하위 아펠라시옹(재귀)으로 필터
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: 셀러 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CellarEntry"
                  pagination:
                    $ref: "#/components/schemas/CellarPagination"
    post:
      tags: [WineDuck - Cellar]
      summary: 셀러에 와인 추가
      operationId: createCellarEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellarCreateRequest"
      responses:
        "201":
          description: 셀러 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  entry_id:
                    type: integer

  /cellar/stats:
    get:
      tags: [WineDuck - Cellar]
      summary: 셀러 통계 (총 병 수, 총 가치, 국가별 분포)
      operationId: cellarStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 셀러 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  total_bottles_in_cellar:
                    type: integer
                  total_value:
                    type: number
                  country_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        country_name:
                          type: string
                        country_name_ko:
                          type: string
                        iso_code:
                          type: string
                        bottle_count:
                          type: integer

  /cellar/expiring:
    get:
      tags: [WineDuck - Cellar]
      summary: 음용 적기 임박 와인 (와인 음용적기 종료연도(drink_until_year) ≤ 올해)
      description: |
        `status='in_cellar' AND w.drink_until_year IS NOT NULL AND w.drink_until_year <= YEAR(CURDATE())` 조건의 보유 와인.
        `w.drink_until_year ASC` 정렬. 홈 화면 "곧 마셔야 할 와인" 카드용.
      operationId: listExpiringCellarEntries
      security:
        - bearerAuth: []
      parameters:
        - name: n
          in: query
          description: 반환 개수 (기본 10, 최대 50)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: 임박 와인 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CellarEntry"
                  count: { type: integer }

  /cellar/{entry_id}:
    get:
      tags: [WineDuck - Cellar]
      summary: 셀러 엔트리 상세
      operationId: getCellarEntry
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 셀러 엔트리
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  entry:
                    $ref: "#/components/schemas/CellarEntry"
    put:
      tags: [WineDuck - Cellar]
      summary: 셀러 엔트리 부분 수정
      operationId: updateCellarEntry
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellarUpdateRequest"
      responses:
        "200":
          description: 수정 성공
    delete:
      tags: [WineDuck - Cellar]
      summary: 셀러 엔트리 소프트 삭제
      operationId: deleteCellarEntry
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제 성공

  /cellar/{entry_id}/consume:
    post:
      tags: [WineDuck - Cellar]
      summary: 셀러 와인 소비 처리 (오픈한 병 기록)
      operationId: consumeCellarEntry
      description: |
        `SELECT FOR UPDATE`로 수량 정합성 보장.
        - 전량 소비 시 `status` / `consumed_at` / `consumed_quantity` / `tasting_id` 필드 원자적 기록.
        - 부분 소비 시 `quantity`만 차감, 상태는 유지.
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, status]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [consumed, gifted]
                tasting_id:
                  type: integer
                  description: 연결할 테이스팅 노트 ID (옵션)
                  nullable: true
      responses:
        "200":
          description: 소비 기록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  remaining_quantity:
                    type: integer

# ──────────────────────────────────────────
# Components
# ──────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 토큰 (24시간 유효). /api/auth/login으로 발급.

  schemas:
    UserInfo:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, super-admin]

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    CoffeeListItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        supplier:
          type: string
          description: 로스터리/공급처
        created_at:
          type: string
        avg_rating:
          type: number
        comment_count:
          type: integer
        flavor_notes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              color:
                type: string

    CoffeeDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        supplier:
          type: string
        harvest_year:
          type: integer
          nullable: true
        origin:
          type: object
          properties:
            country:
              type: string
            region:
              type: string
            farm_name:
              type: string
            producer:
              type: string
              nullable: true
            altitude_meters:
              type: integer
              nullable: true
        processing:
          type: object
          properties:
            method:
              type: string
            fermentation:
              type: string
              nullable: true
        varietal:
          type: array
          items:
            type: string
        flavor_notes:
          type: array
          items:
            $ref: "#/components/schemas/FlavorNote"

    FlavorNote:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        name_ko:
          type: string
        name_ja:
          type: string
        color:
          type: string
          nullable: true

    CoffeeCreateRequest:
      type: object
      required: [name, roastery]
      properties:
        name:
          type: string
          description: "커피 이름 (예: Ethiopia Yirgacheffe Konga)"
        roastery:
          type: string
          description: 로스터리/공급처
        coffee_type:
          type: string
          enum: [single_origin, blend]
          default: single_origin
        origin:
          type: object
          properties:
            country:
              type: string
              description: 산지 국가 (싱글 오리진 시 필수)
            region:
              type: string
            farm_name:
              type: string
            producer:
              type: string
            altitude_meters:
              type: integer
        processing:
          type: string
          description: "가공법 (Washed, Natural, Honey, Anaerobic 등)"
        fermentation:
          type: string
        harvest_year:
          type: integer
        variety:
          type: array
          items:
            type: string
          description: "품종 (예: [\"Heirloom\", \"SL28\"])"
        flavor_notes:
          type: array
          items:
            type: string
          description: "대표 향미 (예: [\"blueberry\", \"jasmine\"])"
        detail:
          type: string

    CoffeeTastingCreateRequest:
      type: object
      required: [rating]
      properties:
        tasted_at:
          type: string
          format: date
          description: "시음 날짜 (YYYY-MM-DD, 기본: 오늘)"
        acidity:
          type: integer
          minimum: 0
          maximum: 100
          description: 산도 (0-100)
        body:
          type: integer
          minimum: 0
          maximum: 100
          description: 바디 (0-100)
        sweetness:
          type: integer
          minimum: 0
          maximum: 100
          description: 당도 (0-100)
        bitterness:
          type: integer
          minimum: 0
          maximum: 100
          description: 쓴맛 (0-100)
        finish:
          type: integer
          minimum: 0
          maximum: 100
          description: 여운 (0-100)
        roasting_level:
          type: string
          enum: [light, medium_light, medium, medium_dark, dark]
        brew_method:
          type: string
          description: "추출 방법 (pour over, espresso, aeropress 등)"
        rating:
          type: number
          minimum: 0
          maximum: 5
          description: 총점 (0.0-5.0, 필수)
        one_liner:
          type: string
          maxLength: 280
          description: 한줄평
        flavor_note_ids:
          type: array
          items:
            type: integer
          description: 플레이버 노트 ID 배열 (/api/flavor-notes에서 조회)

    CoffeeTastingUpdateRequest:
      type: object
      properties:
        tasted_at:
          type: string
          format: date
        acidity:
          type: integer
        body:
          type: integer
        sweetness:
          type: integer
        bitterness:
          type: integer
        finish:
          type: integer
        roasting_level:
          type: string
        brew_method:
          type: string
        rating:
          type: number
        one_liner:
          type: string
        flavor_note_ids:
          type: array
          items:
            type: integer

    WineType:
      type: string
      description: 정식 타입은 red/white/sparkling/rose. white_sparkling은 저장된 기존 데이터 및 요청 하위 호환값.
      enum: [red, white, sparkling, rose, white_sparkling]
    WineAromaInput:
      type: object
      properties:
        source: { type: string, enum: [custom, taxonomy] }
        custom_label: { type: string, maxLength: 255 }
        node_id: { type: integer }
    WineTastingCreateResponse:
      type: object
      required: [success, tasting_id]
      properties:
        success: { type: boolean }
        message: { type: string }
        tasting_id: { type: integer }
    WineCreateResponse:
      type: object
      required: [success, wine_id, resolved]
      properties:
        success: { type: boolean }
        message: { type: string }
        wine_id: { type: integer }
        resolved:
          type: object
          properties:
            country_id: { type: [integer, 'null'] }
            region_id: { type: [integer, 'null'] }
            appellation_id: { type: [integer, 'null'] }
            country_code: { type: [string, 'null'] }
            region: { type: [string, 'null'] }
    WineByRegionResponse:
      type: object
      properties:
        success: { type: boolean }
        wines: { type: array, items: { $ref: '#/components/schemas/WineSearchResult' } }
        pagination: { $ref: '#/components/schemas/CellarPagination' }
    AppellationSearchResponse:
      type: object
      required: [success, items]
      description: |
        와인 등록의 정본 아펠라시옹 resolve 결과. items는 최대 10건이며 prefix 매칭이
        먼저 오는 결정적 순서다.
      properties:
        success: { type: boolean }
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, description: appellation_id — POST /wineduck/wines에 그대로 넘긴다 }
              name: { type: string, description: 아펠라시옹 정식명 (라틴/영문) }
              name_ko: { type: string, nullable: true, description: 한글 표기(있을 때) }
              region: { type: string, nullable: true, description: 상위 지역명 }
              country: { type: string, nullable: true, description: 국가명 }
              classification: { type: string, nullable: true, description: 등급/분류(있을 때) }
    UserWineTastingsResponse:
      type: object
      required: [success, tastings, total, overall_total, limit, offset, has_more]
      properties:
        success: { type: boolean }
        tastings: { type: array, items: { type: object, additionalProperties: true } }
        total: { type: integer }
        overall_total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    PalateInsightResponse:
      type: object
      required: [state, candidates, next_cta]
      properties:
        state: { type: string, enum: [S0, S1, S2, S3] }
        clue: { type: object, additionalProperties: true }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
        taste_tendency: { type: string }
        next_cta: { type: object, additionalProperties: true }
    WineRecommendationsResponse:
      type: object
      properties:
        success: { type: boolean }
        wines:
          type: array
          items:
            type: object
            properties:
              wine: { type: object, additionalProperties: true }
              score: { type: number, description: 사용자 내 상대 정렬값 }
              palate_similarity: { type: number, minimum: 0, maximum: 1 }
              reasons: { type: array, items: { type: string } }
        need_more: { type: boolean }
        min_count_required: { type: integer }
        user_tasting_count: { type: integer }
        user_total_count: { type: integer }
        user_palate_count: { type: integer }
        candidate_pool_size: { type: integer }
    WineLabelAnalysisRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, description: base64 또는 data URL 이미지 }
    WineLabelAnalysisResponse:
      type: object
      required: [success, wine_info, usage]
      properties:
        success: { type: boolean }
        wine_info: { type: object, additionalProperties: true, description: 검증되지 않은 모델 생성 후보 }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
    ConquestBoardAppellation:
      type: object
      properties:
        id: { type: integer }
        name_ko: { type: [string, 'null'] }
        name_en: { type: [string, 'null'] }
        name_ja: { type: [string, 'null'] }
        self_conquered: { type: boolean }
        conquered: { type: boolean, description: 하위 아펠라시옹 정복까지 롤업 }
        cellar_bottles: { type: integer }
        my_notes: { type: integer }
        vintages: { type: array, items: { oneOf: [{ type: integer }, { type: string, enum: [NV] }] } }
        favorite: { type: boolean }
        children: { type: array, items: { $ref: '#/components/schemas/ConquestBoardAppellation' } }
    ConquestBoardResponse:
      type: object
      properties:
        success: { type: boolean }
        totals:
          type: object
          properties:
            conquered: { type: integer }
            appellations_total: { type: integer }
        countries: { type: array, items: { type: object, additionalProperties: true } }
    ConquestBoardSchemaNotReadyResponse:
      type: object
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }
        code: { type: string, enum: [WINEDUCK_BOARD_SCHEMA_NOT_READY] }

    WineSearchResult:
      type: object
      properties:
        id:
          type: integer
        canonical_name:
          type: string
        producer:
          type: string
        wine_type:
          type: string
          enum: [red, white, sparkling, rose, white_sparkling]
        vintage_year:
          type: integer
          nullable: true
        country_code:
          type: string

    WineCreateRequest:
      type: object
      required: [canonical_name]
      properties:
        canonical_name:
          type: string
          description: |
            와인 이름. 타입별 규칙:
            - Type A (구세계): 아펠라시옹 + 크뤼/특수표기. 생산자 포함 금지. (예: Gevrey-Chambertin Vieilles Vignes)
            - Type B (신세계): 생산자 + 품종. (예: Far Niente Cabernet Sauvignon)
            - Type C (브랜드): 브랜드명. (예: Opus One)
        wine_type:
          type: string
          enum: [red, white, sparkling, rose, white_sparkling]
          description: 정식 red/white/sparkling/rose. white_sparkling은 레거시 호환값.
        producer:
          type: string
          description: 생산자 (도멘/네고시앙/와이너리)
        vintage_year:
          type: integer
          nullable: true
          description: 빈티지 연도 (NV는 null)
        grapes_text:
          type: string
          description: "품종 (쉼표 구분, 예: Pinot Noir)"
        drink_from_year:
          type: integer
          nullable: true
          description: "음용 적기 시작 연도 (예: 2026). 와인 자체의 권장 음용 시기(셀러 병 단위와 별개)."
        drink_until_year:
          type: integer
          nullable: true
          description: "음용 적기 종료 연도 (예: 2034)."
        peak_year:
          type: integer
          nullable: true
          description: "음용 피크 연도 (예: 2030). 정합성: drink_from_year ≤ peak_year ≤ drink_until_year (연도 1900~2100)."
        country_id:
          type: integer
          description: 국가 ID (/api/wineduck/countries에서 조회)
        region_id:
          type: integer
          description: 지역 ID (/api/wineduck/countries/{id}/regions에서 조회)
        appellation_id:
          type: integer
          description: 아펠라시옹 ID (/api/wineduck/regions/{id}/appellations에서 조회)

    WineTastingCreateRequest:
      type: object
      required: [wine_type]
      properties:
        wine_type:
          type: string
          enum: [red, white, sparkling, rose, white_sparkling]
          description: 와인 타입 (필수)
        tasted_at:
          type: string
          format: date
          description: "시음 날짜 (YYYY-MM-DD, 기본: 오늘)"
        sweetness:
          type: integer
          minimum: 1
          maximum: 5
          description: 당도 (1-5)
        acidity:
          type: integer
          minimum: 1
          maximum: 5
          description: 산도 (1-5)
        body:
          type: integer
          minimum: 1
          maximum: 5
          description: 바디 (1-5)
        tannin:
          type: integer
          minimum: 1
          maximum: 5
          description: 타닌 (1-5)
        finish:
          type: integer
          minimum: 1
          maximum: 5
          description: 여운 (1-5)
        aroma_intensity:
          type: integer
          minimum: 1
          maximum: 6
          description: 향 강도 (1-6)
        rating:
          type: number
          minimum: 0
          maximum: 5
          description: 총점 (0.0-5.0)
        one_liner:
          type: string
          description: 한줄평
        repurchase:
          type: boolean
          description: 재구매 의향
        pairing_food:
          type: string
          description: 페어링 음식
        color:
          type: string
          description: "색상 (ruby, garnet, purple 등)"
        price_amount:
          type: number
          description: 가격
        currency_code:
          type: string
          enum: [KRW, USD, EUR]
          default: KRW
        aromas:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum: [custom, taxonomy]
              custom_label:
                type: string
                description: source=custom일 때 향 이름
              node_id:
                type: integer
                description: source=taxonomy일 때 아로마 DB ID
          description: 향 목록 (커스텀 또는 택소노미)

    WineTastingUpdateRequest:
      type: object
      description: 본인 기록의 부분 수정. aromas를 보내면 기존 향을 교체한다.
      properties:
        tasted_at: { type: string, format: date-time }
        price_amount: { type: number }
        currency_code: { type: string }
        pairing_food: { type: string }
        wine_type: { $ref: "#/components/schemas/WineType" }
        color: { type: string }
        aroma_intensity: { type: integer, minimum: 1, maximum: 6 }
        sweetness: { type: integer, minimum: 1, maximum: 5 }
        acidity: { type: integer, minimum: 1, maximum: 5 }
        body: { type: integer, minimum: 1, maximum: 5 }
        tannin: { type: integer, minimum: 1, maximum: 5 }
        finish: { type: integer, minimum: 1, maximum: 5 }
        drink_window: { type: string, enum: [now, within_1_5y, over_5y] }
        repurchase: { type: boolean }
        rating: { type: number, minimum: 0, maximum: 5 }
        one_liner: { type: string }
        aromas:
          type: array
          items: { $ref: "#/components/schemas/WineAromaInput" }

    CellarEntry:
      type: object
      description: 셀러 엔트리 (와인/국가/지역/아펠라시옹 JOIN 포함)
      properties:
        id:
          type: integer
        user_id:
          type: integer
        wine_id:
          type: integer
        quantity:
          type: integer
          description: 보유 병 수
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_price:
          type: number
          nullable: true
        currency:
          type: string
          example: KRW
        storage_location:
          type: string
          nullable: true
